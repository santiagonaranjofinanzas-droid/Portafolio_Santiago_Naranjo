[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsmm-xau-research"
version = "0.1.0"
description = "Causal HSMM research pipeline for XAUUSD mean-reversion regimes"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "hmmlearn>=0.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hsmm-xau = "hsmm_xau.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

