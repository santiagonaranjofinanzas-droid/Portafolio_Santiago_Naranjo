project:
  name: hsmm_xau_m15
  version: "1.0"
  seed: 20260716
  timezone: UTC
  protocol: PLAN_QUANT_RESEARCH_HSMM_XAUUSD.md

paths:
  ticks: ticks_parquet
  artifacts: artifacts
  ledger: research/ledger.jsonl

data:
  primary_symbol: XAUUSD
  context_symbols: [XAGUSD, NSXUSD]
  bar_frequency: 15min
  expected_start: "2012-01-01"
  expected_end: "2026-07-16"
  # Reset rolling state only across abnormal data outages (>5 days), not routine rollovers/weekends.
  max_gap_bars: 480
  extreme_spread_quantile: 0.999

equilibrium:
  kalman_process_variance: 0.000001
  kalman_observation_variance: 0.0001
  z_window: 96
  ewma_span: 96

labels:
  event_z: 1.5
  target_z: 0.25
  stop_z: 2.5
  horizons: [8, 16, 32]
  primary_horizon: 16
  purge_bars: 32

features:
  windows: [16, 32, 64, 96]
  selected:
    - residual_z
    - return_acf1_64
    - variance_ratio_64
    - half_life_64
    - efficiency_ratio_32
    - realized_vol_32
    - range_atr_32
    - spread_z_96
    - session_sin
    - session_cos

model:
  states: 4
  state_names: [mean_reversion, trend, breakout, neutral]
  covariance_type: diag
  max_duration: 64
  duration_family: poisson
  n_seeds: 3
  max_iter: 100
  tolerance: 0.0001
  min_state_occupancy: 0.01

walk_forward:
  train_years: 3
  calibration_months: 3
  test_months: 3
  step_months: 3
  embargo_bars: 32

costs:
  commission_price: 0.0
  slippage_spread_fraction: 0.10
  spread_multiplier: 1.0

decision:
  mr_probability_threshold: 0.60
  max_breakout_probability: 0.25
  min_expected_value: 0.0

shadow:
  enabled: false
  kill_switch: true
  reason: "Historical approval criteria not yet satisfied"

approval:
  max_ece: 0.05
  min_roc_auc: 0.60
  min_mcc: 0.15
  min_profit_factor: 1.20
  min_sharpe: 1.0
  min_positive_fold_fraction: 0.70
