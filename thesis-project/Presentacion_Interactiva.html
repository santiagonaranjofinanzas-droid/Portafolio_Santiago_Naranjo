<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defensa de Tesis: Detección de Regímenes HMM-XGBoost</title>
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- MathJax configurado localmente para renderizado TeX a SVG (100% Offline) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --accent-indigo: #6366f1;
            --border-radius: 12px;
            --font-main: 'Outfit', sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan) var(--bg-secondary);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow-hidden: hidden;
            height: 100vh;
            display: flex;
        }

        /* Contenedor Principal */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Barra Lateral (Navegación de Diapositivas) */
        .sidebar {
            width: 300px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .sidebar-header p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .steps-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 24px;
            padding-right: 4px;
        }

        .step-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            text-align: left;
        }

        .step-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .step-item.active {
            background: rgba(6, 182, 212, 0.1);
            border-color: rgba(6, 182, 212, 0.3);
            color: var(--accent-cyan);
        }

        .step-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .step-item.active .step-number {
            background-color: var(--accent-cyan);
            color: var(--bg-primary);
        }

        .step-title-text {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-footer {
            border-top: 1px solid var(--glass-border);
            padding-top: 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Área de Contenido Principal (Slide) */
        .content-area {
            flex-grow: 1;
            padding: 32px;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Cabecera del Slide */
        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 16px;
        }

        .slide-title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .slide-title h1 span {
            color: var(--accent-cyan);
        }

        .slide-tag {
            background-color: rgba(99, 102, 241, 0.15);
            color: var(--accent-indigo);
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* Controles de Perspectiva (Tabs) */
        .perspective-container {
            display: flex;
            background-color: var(--bg-secondary);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            width: fit-content;
        }

        .perspective-tab {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .perspective-tab:hover {
            color: var(--text-primary);
        }

        .perspective-tab.active {
            background-color: var(--accent-cyan);
            color: var(--bg-primary);
        }

        /* Cuerpo del Slide (Grid Dos Columnas) */
        .slide-body {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 32px;
            flex-grow: 1;
            min-height: 0; /* Permite scroll interno */
        }

        @media (max-width: 1024px) {
            .slide-body {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
        }

        /* Columna Explicativa */
        .explanation-pane {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(6, 182, 212, 0.2);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .explanation-text p {
            margin-bottom: 12px;
        }

        .explanation-text ul, .explanation-text ol {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .explanation-text li {
            margin-bottom: 6px;
        }

        /* Columna Visual / Interactiva */
        .visualizer-pane {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.01);
            border: 1px dashed var(--glass-border);
            border-radius: var(--border-radius);
            padding: 16px;
            position: relative;
            min-height: 350px;
            overflow: hidden;
        }

        /* Diapositivas e Imágenes */
        .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .thesis-img {
            max-width: 100%;
            max-height: 380px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background-color: #ffffff; /* Algunas gráficas de matplotlib tienen fondo blanco transparente */
            transition: transform 0.3s ease;
        }

        .thesis-img:hover {
            transform: scale(1.02);
        }

        .image-caption {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            max-width: 80%;
        }

        /* Formateo de Código */
        pre {
            background-color: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            width: 100%;
            max-height: 400px;
            font-family: var(--font-code);
            font-size: 0.8rem;
            line-height: 1.4;
            color: #e5e7eb;
        }

        code .keyword { color: #f43f5e; }
        code .function { color: #6366f1; }
        code .string { color: #10b981; }
        code .comment { color: #6b7280; font-style: italic; }
        code .number { color: #f59e0b; }

        /* Renderizado Matemático Limpio (CSS + HTML) */
        .math-block {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin: 12px 0;
            font-family: 'Outfit', serif;
            font-style: italic;
            font-size: 1.15rem;
            border-left: 3px solid var(--accent-cyan);
            color: var(--text-primary);
        }

        .math-inline {
            font-family: 'Outfit', serif;
            font-style: italic;
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Botones de Navegación del Slider */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border-top: 1px solid var(--glass-border);
            padding-top: 16px;
        }

        .nav-btn {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: var(--accent-cyan);
            color: var(--bg-primary);
            border-color: var(--accent-cyan);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Dashboard de Resultados (Paso 7) */
        .results-dashboard {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-card.highlight {
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.03);
        }

        .metric-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .metric-comparison {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 4px;
        }

        .metric-value-model {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-value-model.win {
            color: var(--accent-emerald);
        }

        .metric-value-bench {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .comparison-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-positive {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-emerald);
        }

        .badge-neutral {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
        }

        /* Simulador de Purga y Embargo (Paso 6) */
        .simulator-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sim-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .sim-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            border: 1px solid var(--glass-border);
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sim-btn.active {
            background-color: var(--accent-indigo);
            color: white;
            border-color: var(--accent-indigo);
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 4px;
            margin: 12px 0;
        }

        .timeline-node {
            height: 36px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
        }

        .node-train {
            background-color: rgba(99, 102, 241, 0.3);
            border-color: var(--accent-indigo);
            color: #c7d2fe;
        }

        .node-val {
            background-color: rgba(16, 185, 129, 0.3);
            border-color: var(--accent-emerald);
            color: #a7f3d0;
        }

        .node-purged {
            background-color: rgba(244, 63, 94, 0.15);
            border-color: var(--accent-rose);
            color: var(--accent-rose);
            text-decoration: line-through;
            opacity: 0.5;
        }

        .node-embargo {
            background-color: rgba(245, 158, 11, 0.15);
            border-color: var(--accent-amber);
            color: var(--accent-amber);
            text-decoration: line-through;
            opacity: 0.5;
        }

        .node-overlap {
            background-color: rgba(244, 63, 94, 0.4);
            border-color: var(--accent-rose);
            color: #fecdd3;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        .sim-legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* Alertas tipo github */
        .alert-box {
            border-left: 4px solid transparent;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            background-color: rgba(255,255,255,0.02);
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .alert-note {
            border-left-color: var(--accent-cyan);
            background-color: rgba(6, 182, 212, 0.03);
        }

        .alert-warning {
            border-left-color: var(--accent-amber);
            background-color: rgba(245, 158, 11, 0.03);
        }

        .alert-danger {
            border-left-color: var(--accent-rose);
            background-color: rgba(244, 63, 94, 0.03);
        }

        .alert-box strong {
            display: block;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .alert-note strong { color: var(--accent-cyan); }
        .alert-warning strong { color: var(--accent-amber); }
        .alert-danger strong { color: var(--accent-rose); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- BARRA LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Inferencia de Regímenes</h2>
                <p>HMM-XGBoost Híbrido en Finanzas</p>
            </div>
            
            <ul class="steps-list" id="stepsList">
                <!-- Generado dinámicamente por JS -->
            </ul>
            
            <div class="sidebar-footer">
                Tesis de Grado en Economía<br>Universidad de Tesis
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="content-area">
            
            <!-- Cabecera del Slide -->
            <div class="slide-header">
                <div class="slide-title">
                    <h1 id="slideTitle">Paso 1: <span>Cargando...</span></h1>
                </div>
                <span class="slide-tag" id="slideTag">Estadística</span>
            </div>

            <!-- Selectores de Perspectiva (Sub-Tabs) -->
            <div class="perspective-container" id="perspectiveContainer">
                <button class="perspective-tab active" onclick="setPerspective('concepto')">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    Concepto
                </button>
                <button class="perspective-tab" onclick="setPerspective('matematica')">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    Matemática
                </button>
                <button class="perspective-tab" onclick="setPerspective('codigo')">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                    Código
                </button>
                <button class="perspective-tab" onclick="setPerspective('visualizacion')">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Visualización
                </button>
            </div>

            <!-- Cuerpo del Slide -->
            <div class="slide-body">
                <!-- Columna Izquierda: Explicación -->
                <div class="explanation-pane" id="explanationPane">
                    <!-- Dinámico -->
                </div>

                <!-- Columna Derecha: Visualización interactiva o imagen -->
                <div class="visualizer-pane" id="visualizerPane">
                    <!-- Dinámico -->
                </div>
            </div>

            <!-- Botones Inferiores de Navegación del Slide -->
            <div class="nav-buttons">
                <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Anterior
                </button>
                <span style="font-size: 0.85rem; color: var(--text-secondary);" id="slideProgress">Slide 1 de 7</span>
                <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">
                    Siguiente
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>

        </main>
    </div>

    <!-- SCRIPT DE DATOS Y LOGICA DE NAVEGACION -->
    <script>
        // Datos de la presentación
        const slidesData = [
            {
                title: "Marco Teórico & Mercados Adaptativos",
                tag: "Teoría Económica",
                concepto: `
                    <div class="card">
                        <div class="card-title">La Hipótesis del Mercado Adaptativo (AMH)</div>
                        <div class="explanation-text">
                            <p>La asignación estática tradicional asume que las correlaciones y primas de riesgo son constantes en el tiempo. Sin embargo, en la práctica, los mercados operan como <strong>Sistemas Adaptativos Complejos (SAC)</strong>.</p>
                            <p>En el marco de la AMH propuesto por Andrew Lo, la eficiencia de mercado no es un estado absoluto, sino que fluctúa según las fuerzas evolutivas de competencia, adaptación y supervivencia de los agentes.</p>
                            <p>Los parámetros de riesgo y retorno colapsan precisamente en transiciones estructurales de mercado. Esta tesis propone un <strong>modelo híbrido (HMM + XGBoost)</strong> para capturar probabilísticamente estas dinámicas no lineales de cambio de régimen.</p>
                        </div>
                    </div>

        // Manejar errores de imágenes cuando el usuario corre la página localmente
        function imgError(image) {
            image.onerror = null;
            // Reemplazar por un placeholder SVG explicativo si la imagen no se encuentra
            const parent = image.parentNode;
            const altText = image.alt;
            
            // Crear bloque visual explicativo
            const placeholder = document.createElement('div');
            placeholder.style.width = '100%';
            placeholder.style.height = '200px';
            placeholder.style.border = '1px dashed var(--accent-cyan)';
            placeholder.style.borderRadius = '8px';
            placeholder.style.background = 'rgba(6, 182, 212, 0.03)';
            placeholder.style.display = 'flex';
            placeholder.style.flexDirection = 'column';
            placeholder.style.alignItems = 'center';
            placeholder.style.justifyContent = 'center';
            placeholder.style.padding = '20px';
            placeholder.style.textAlign = 'center';
            placeholder.innerHTML = `
                <svg width="32" height="32" fill="none" stroke="var(--accent-cyan)" viewBox="0 0 24 24" style="margin-bottom:8px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <div style="font-size:0.8rem; font-weight:600; color:var(--text-primary);">${altText}</div>
                <div style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;">Archivo de imagen esperado en el directorio:</div>
                <div style="font-family:var(--font-code); font-size:0.65rem; color:var(--accent-cyan); margin-top:2px;">${image.src.replace(window.location.origin + '/', '')}</div>
            `;
            
            parent.insertBefore(placeholder, image);
            parent.removeChild(image);
        }

        // Función para renderizar ecuaciones matemáticas usando MathJax (offline-safe)
        function renderMath() {
            if (typeof MathJax === 'undefined'  !MathJax.typeset) {
                // MathJax no se ha cargado aún, reintentar en 50ms
                setTimeout(renderMath, 50);
                return;
            }
            
            let needsTypeset = false;
            
            document.querySelectorAll('.math-block').forEach(el => {
                let txt = el.textContent.trim();
                // Si ya contiene MathJax SVG, no lo tocamos
                if (el.querySelector('mjx-container')) return;
                
                if (!txt.startsWith('\\[') && !txt.startsWith('$$')) {
                    el.textContent = '$$\n' + txt + '\n$$';
                    needsTypeset = true;
                }
            });
            
            document.querySelectorAll('.math-inline').forEach(el => {
                let txt = el.textContent.trim();
                if (el.querySelector('mjx-container')) return;
                
                if (!txt.startsWith('\\(') && !txt.startsWith('$')) {
                    el.textContent = '$' + txt + '$';
                    needsTypeset = true;
                }
            });
            
            if (needsTypeset) {
                try {
                    MathJax.typeset();
                } catch (e) {
                    console.error('Error en MathJax typeset:', e);
                }
            }
        }

        // Inicializar
        window.onload = () => {
            initSidebar();
            updateSlideUI();
        };
    </script>
