name: Quality Gate

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt pytest pip-audit
      - run: python -m pytest backend/tests -q
      - run: cd backend/bloomberg/decision-engine && python -m pytest test_engine.py -q
      - run: cd backend/bloomberg/mirofish && python -m pytest test_mirofish.py -q
      - run: cd backend/bloomberg/quant-service && python -m pytest test_api.py -q
      - run: python -m py_compile backend/app/*.py
      - name: Dependency audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
